name: Python quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validation tools
        run: python -m pip install ruff==0.15.21
      - name: Lint Python sources
        run: python -m ruff check custom_components
      - name: Compile Python sources
        run: python -m compileall -q custom_components
